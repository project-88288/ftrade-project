# Monitoring overlay: adds Prometheus + Grafana alongside the bot and dashboard.
# Grafana comes pre-provisioned with the Prometheus datasource and the ftrade
# dashboard, so the whole stack is up with one command:
#
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --build
#
#   Grafana:    http://localhost:3001  (admin / admin)
#   Prometheus: http://localhost:9090
#   Dashboard:  http://localhost:3000
services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - dashboard
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/ftrade.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
